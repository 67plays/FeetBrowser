[package]
name = "feetbrowser-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "feetbrowser_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "py-clone"] }
miniz_oxide = "0.8"
regex = "1"
chrono = "0.4"
serde_json = "1"

[profile.release]
lto = true
opt-level = 3