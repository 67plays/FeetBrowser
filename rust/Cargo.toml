[package]
name = "feetbrowser-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "feetbrowser_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "py-clone"] }
miniz_oxide = "0.8"
serde_json = "1"
# The WHATWG tokeniser and tree builder, which used to be `src/html/` here.
# Ours, split out because nothing in it knows a browser exists: it has no
# dependencies of its own and its conformance suite is 27k lines of vendored
# fixtures that only it ever ran. Pinned by revision -- a parser that changed
# under us between two builds would change what pages mean, on a commit that
# touched nothing here.
#
# To move to a newer footnote, put its sha here and nowhere else:
#
#     gh api repos/67plays/footnote/commits/main --jq .sha
#
footnote = { git = "https://github.com/67plays/footnote", rev = "1a3a0b0c8f9bd7ef9b49808863db43e2aa0f4c57" }

[profile.release]
lto = true
opt-level = 3