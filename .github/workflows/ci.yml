name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonts and pyflakes
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation
          python -m pip install pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes feetbrowser tests

      - name: Renderer tests
        run: python tests/test_render.py

      - name: Unit tests
        run: python tests/test_units.py

      - name: JS engine tests
        run: python tests/test_js.py

      - name: Toe engine tests
        run: python tests/test_toes.py

      - name: Pseudo-toe (gh-scroll) tests
        run: python tests/test_gh_scroll.py

      - name: Screenshot a page end to end
        run: |
          python -m feetbrowser --screenshot about:blank /tmp/blank.png
          python - <<'EOF'
          import os
          size = os.path.getsize("/tmp/blank.png")
          assert size > 2000, f"screenshot suspiciously small: {size} bytes"
          print(f"rendered /tmp/blank.png ({size} bytes)")
          EOF
