name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No Tk and no Xvfb: rendering is our own and runs with no display.
      # The only outside requirement is a system font.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Build the Rust JS engine
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pyflakes
          .venv/bin/maturin develop --release --manifest-path rust/Cargo.toml

      - name: Lint (pyflakes)
        run: .venv/bin/python -m pyflakes feetbrowser tests

      # Warnings are kept at zero deliberately. Denying them here is the only
      # thing that keeps it true; 84 of them accumulated the other way.
      - name: Rust warnings
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --manifest-path rust/Cargo.toml --all-targets

      - name: Renderer tests
        run: .venv/bin/python tests/test_render.py

      # Each skips itself off its own platform; here to prove the skips stay
      # clean, and test_x11 and test_win32 still run their whole offline
      # halves -- the arithmetic behind a window needs no window.
      - name: Platform window tests
        run: |
          .venv/bin/python tests/test_cocoa.py
          .venv/bin/python tests/test_x11.py
          .venv/bin/python tests/test_win32.py

      - name: Unit tests
        run: .venv/bin/python tests/test_units.py

      - name: JS engine tests
        run: .venv/bin/python tests/test_js.py

      - name: Shoes tests
        run: .venv/bin/python tests/test_shoes.py

      - name: Toe engine tests
        run: .venv/bin/python tests/test_toes.py

      # Linux/x86-64 assembles and runs the real kernels here; everywhere
      # else the module's pure-Python fallback is what gets checked.
      - name: Assembly span kernels
        run: .venv/bin/python tests/test_asmblend.py

      # Into the workspace rather than /tmp, and through a script rather than
      # an inline heredoc, so the Windows job below can run the same two
      # lines on a runner whose temporary directory is spelled another way.
      - name: Screenshot a page end to end
        run: |
          .venv/bin/python -m feetbrowser --screenshot about:blank blank.png
          .venv/bin/python tests/check_screenshot.py blank.png

  # The job above proves the browser needs no display. This one proves it can
  # use one: a real X server, a real window, real events, and a photograph of
  # the result taken with XGetImage.
  x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonts and an X server
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation xvfb

      - name: Build the Rust JS engine
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin
          .venv/bin/maturin develop --release --manifest-path rust/Cargo.toml

      # 24-bit TrueColor: what every desktop actually runs, and the format
      # the backend converts to with no per-pixel work.
      - name: X11 tests at depth 24
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            .venv/bin/python tests/test_x11.py

      # 16-bit 5-6-5, which no byte layout can describe, so this is the only
      # thing that ever runs the slow per-channel path against a real server.
      - name: X11 tests at depth 16
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x16" \
            .venv/bin/python tests/test_x11.py

      - name: Photograph a real X11 window
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            .venv/bin/python tests/x11_shot.py artifacts/x11-window.png

      - name: Upload the window
        uses: actions/upload-artifact@v4
        with:
          name: x11-window
          path: artifacts/x11-window.png
          if-no-files-found: error


  # The Windows platform layer is the one part of this browser that cannot be
  # exercised anywhere else. The jobs above only prove that test_win32.py
  # skips cleanly; this is where win32.py actually runs, opening real windows,
  # pumping real messages and reading pixels back out of GDI.
  #
  # It is deliberately a whole job rather than a line in a matrix, because it
  # is the only one that needs the Windows spelling of every path. When the
  # composite build action lands it collapses into one more matrix entry.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, for `set -e`: a failing line in a multi-line step has to
        # fail the step, which the default PowerShell only guarantees for the
        # last line of the block.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Windows ships its own fonts, so unlike the Linux jobs there is nothing
      # to install for text, and the Rust toolchain is already on this image.
      - name: Show the toolchain
        run: |
          rustc --version
          cargo --version

      # The venv sees system site-packages for the same reason run.sh does:
      # the optional image decoders are installed outside it, and a sealed
      # venv hides them without saying so.
      - name: Build the Rust JS engine
        run: |
          python -m venv --system-site-packages .venv
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check -q maturin pyflakes
          .venv/Scripts/maturin.exe develop --release --manifest-path rust/Cargo.toml

      - name: Lint (pyflakes)
        run: .venv/Scripts/python.exe -m pyflakes feetbrowser tests

      - name: Renderer tests
        run: .venv/Scripts/python.exe tests/test_render.py

      # test_win32.py is the whole point of this job: here, and only here, it
      # runs its Windows half instead of printing SKIP. The other two prove
      # their skips stay clean from this side as well.
      - name: Platform window tests
        run: |
          .venv/Scripts/python.exe tests/test_win32.py
          .venv/Scripts/python.exe tests/test_cocoa.py
          .venv/Scripts/python.exe tests/test_x11.py

      - name: Unit tests
        run: .venv/Scripts/python.exe tests/test_units.py

      - name: JS engine tests
        run: .venv/Scripts/python.exe tests/test_js.py

      - name: Shoes tests
        run: .venv/Scripts/python.exe tests/test_shoes.py

      - name: Toe engine tests
        run: .venv/Scripts/python.exe tests/test_toes.py

      # No assembler here, so this is the pure-Python fallback being checked
      # on a platform that has nothing else.
      - name: Assembly span kernels
        run: .venv/Scripts/python.exe tests/test_asmblend.py

      - name: Screenshot a page end to end
        run: |
          .venv/Scripts/python.exe -m feetbrowser --screenshot about:blank blank.png
          .venv/Scripts/python.exe tests/check_screenshot.py blank.png

      # What a Windows user actually types. The venv and the engine are built
      # by now, so this also proves the script's short-circuit finds them
      # rather than rebuilding from scratch.
      - name: The Windows entry point runs
        shell: cmd
        run: run.cmd --version
