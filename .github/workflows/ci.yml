name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Build the Rust JS engine
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pyflakes
          .venv/bin/maturin develop --release --manifest-path rust/Cargo.toml

      - name: Lint (pyflakes)
        run: .venv/bin/python -m pyflakes feetbrowser tests

      - name: Unit tests
        run: xvfb-run -a .venv/bin/python tests/test_units.py

      - name: JS engine tests
        run: xvfb-run -a .venv/bin/python tests/test_js.py

      - name: Toe engine tests
        run: xvfb-run -a .venv/bin/python tests/test_toes.py